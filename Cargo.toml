[workspace]
resolver = "3"
members = ["crates/proto", "crates/host", "crates/client-core", "crates/client-linux"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
streetlight-proto = { path = "crates/proto", features = ["net"] }
streetlight-client-core = { path = "crates/client-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["full"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
reed-solomon-simd = "3"
rand = "0.9"
ring = "0.17"
quinn-udp = "0.5"
spake2 = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
